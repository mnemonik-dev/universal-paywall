<!doctype html>
<!-- Part of @universal-paywall/approval-ui. Served by mnemonic-mcp at /approve -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Approve Payment — Universal Paywall</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Approve Universal Paywall Payment</h1>
    <div id="loading">Loading payment details...</div>
    <div id="details" class="hidden">
      <div class="field">
        <div class="label">Operation</div>
        <div class="value" id="operation-id"></div>
      </div>
      <div class="field">
        <div class="label">Amount</div>
        <div class="value" id="amount"></div>
      </div>
      <div class="field">
        <div class="label">Asset</div>
        <div class="value" id="asset"></div>
      </div>
      <div class="field">
        <div class="label">Pay to</div>
        <div class="value" id="pay-to"></div>
      </div>
      <button id="approve-btn" disabled>Approve & Pay</button>
    </div>
    <div id="status" class="hidden"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
